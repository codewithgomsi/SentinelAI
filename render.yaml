# SentinelAI — Render Blueprint
# Deploy: push to GitHub → Render Dashboard → New Blueprint → connect repo
#
# After deploy, set CORS_ORIGINS on the API service to your frontend URL.

services:
  # ── Flask API (Python) ─────────────────────────────────────────────────────
  - type: web
    name: sentinelai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd backend && python ml/train.py
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 wsgi:app
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /api/health

  # ── React Frontend (Static Site) ───────────────────────────────────────────
  - type: web
    name: sentinelai-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
